<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedStudyPro - مساعدك الطبي الذكي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            max-width: 700px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            color: #0284c7;
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8fafc;
            border-right: 4px solid #0284c7;
            border-radius: 6px;
            white-space: pre-wrap;
            line-height: 1.6;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🩺 MedStudyPro</h1>
    
    <div class="input-group">
        <label for="apiKey">مفتاح الذكاء الاصطناعي (Gemini API Key):</label>
        <input type="password" id="apiKey" placeholder="الصق المفتاح الذي نسخته من Google AI Studio هنا">
    </div>

    <div class="input-group">
        <label for="taskType">اختر نوع المساعدة الدراسية:</label>
        <select id="taskType">
            <option value="summarize">تلخيص محاضرة أو نص طبي</option>
            <option value="quiz">إنشاء أسئلة اختبار (MCQs) مع الحل</option>
            <option value="explain">تبسيط مفهوم طبي معقد</option>
        </select>
    </div>

    <div class="input-group">
        <label for="studyText">المحتوى أو السؤال الطبي:</label>
        <textarea id="studyText" rows="6" placeholder="اكتب أو الصق النص الطبي هنا..."></textarea>
    </div>

    <button onclick="generateStudyHelp()">ابدأ المعالجة الذكية ✨</button>

    <div id="result" class="result-box"></div>
</div>

<script>
    async function generateStudyHelp() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const taskType = document.getElementById('taskType').value;
        const studyText = document.getElementById('studyText').value.trim();
        const resultBox = document.getElementById('result');

        if (!apiKey) {
            alert("يرجى إدخال مفتاح API الخاص بك أولاً!");
            return;
        }
        if (!studyText) {
            alert("يرجى كتابة النص الطبي المراد دراسته!");
            return;
        }

        let promptPrefix = "";
        if (taskType === "summarize") {
            promptPrefix = "لخص النص الطبي التالي في نقاط واضحة ومنظمة لطلاب الطب:\n\n";
        } else if (taskType === "quiz") {
            promptPrefix = "أنشئ 5 أسئلة اختيار من متعدد (MCQs) بناءً على النص التالي، مع ذكر الإجابة الصحيحة وشرحها في النهاية:\n\n";
        } else if (taskType === "explain") {
            promptPrefix = "اشرح المفهوم الطبي التالي بأسلوب مبسط جداً مع ضرب أمثلة سريرية إن أمكن:\n\n";
        }

        resultBox.style.display = "block";
        resultBox.innerText = "⏳ جاري تحليل المحتوى وتجهيز الإجابة...";

        try {
            const response = await fetch(`https://googleapis.com{apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptPrefix + studyText }] }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                resultBox.innerText = "❌ خطأ: " + data.error.message;
            } else {
                const reply = data.candidates[0].content.parts[0].text;
                resultBox.innerText = reply;
            }
        } catch (error) {
            resultBox.innerText = "❌ حدث خطأ في الاتصال بالإنترنت أو الخادم.";
        }
    }
</script>

</body>
  </html>
