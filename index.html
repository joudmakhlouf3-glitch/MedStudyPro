<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedStudyPro - المساعد الطبي الشامل</title>
<style>
:root{--p:#0284c7;--pd:#0369a1;--bg:#f1f5f9;--c:#fff;--t:#1e293b;--gb:#dcfce7;--gbd:#16a34a;--gt:#14532d;--rb:#fee2e2;--rbd:#dc2626;--rt:#7f1d1d}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);margin:0;padding:15px;display:flex;justify-content:center}
.box{background:var(--c);max-width:800px;width:100%;padding:22px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{color:var(--p);text-align:center;margin:0 0 20px;font-size:25px}
.grp{margin-bottom:15px}
label{display:block;font-weight:700;margin-bottom:6px;font-size:15px}
input[type=password],textarea,select{width:100%;padding:12px;border:1.5px solid #cbd5e1;border-radius:10px;box-sizing:border-box;font-size:15px;font-family:inherit}
.btn{width:100%;padding:15px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;margin-top:5px}
.btn:hover{background:var(--pd)}
.out{margin-top:25px;display:none}
.res{background:#f8fafc;border-right:4px solid var(--p);padding:18px;border-radius:10px;line-height:1.8;white-space:pre-wrap;font-size:16px}
.qc{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:16px}
.qq{font-weight:700;font-size:17px;margin-bottom:12px;color:#0f172a;line-height:1.5}
.opt{display:block;width:100%;text-align:right;padding:12px 14px;margin-bottom:8px;background:#f8fafc;border:1.5px solid #cbd5e1;border-radius:8px;font-size:15px;cursor:pointer;font-family:inherit;color:var(--t)}
.opt.ok{background:var(--gb)!important;border-color:var(--gbd)!important;color:var(--gt)!important;font-weight:700}
.opt.no{background:var(--rb)!important;border-color:var(--rbd)!important;color:var(--rt)!important;font-weight:700}
.exp{margin-top:12px;padding:12px;background:#f0fdf4;border-right:4px solid var(--gbd);border-radius:8px;font-size:14.5px;line-height:1.6;display:none}
.sb{background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;padding:20px;border-radius:12px;text-align:center;margin-top:20px;display:none}
.ld{text-align:center;padding:20px;font-weight:700;color:var(--p);font-size:17px}
</style>
</head>
<body>
<div class="box">
<h1>🩺 MedStudyPro الشامل</h1>
<div class="grp">
<label>مفتاح الذكاء الاصطناعي:</label>
<input type="password" id="apiKey" placeholder="الصق مفتاح Gemini API هنا">
</div>
<div class="grp">
<label>اختر الأداة الدراسية:</label>
<select id="taskType" onchange="document.getElementById('qGrp').style.display=this.value==='quiz'?'block':'none'">
<option value="sum">🎯 تلخيص دقيق وموجه لأسئلة الـ MCQ</option>
<option value="quiz">📝 اختبار تفاعلي MCQs (أخضر/أحمر + شرح)</option>
<option value="map">🧠 خريطة ذهنية للمحاضرة</option>
</select>
</div>
<div class="grp" id="qGrp" style="display:none">
<label>عدد الأسئلة:</label>
<select id="qCount">
<option value="5">5 أسئلة</option>
<option value="10" selected>10 أسئلة</option>
<option value="15">15 سؤالاً</option>
</select>
</div>
<div class="grp">
<label>النص الطبي للمحاضرة (انسخ النص والصقه هنا لتجنب أخطاء التحميل):</label>
<textarea id="sTxt" rows="8" placeholder="الصق نص المحاضرة الطبية هنا..."></textarea>
</div>
<button class="btn" onclick="run()">ابدأ المعالجة الفورية ✨</button>
<div id="out" class="out"></div>
</div>
<script>
let qData=[],ansC=0,corC=0;
window.onload=()=>{const k=localStorage.getItem('msp_k');if(k)document.getElementById('apiKey').value=k};
const esc=t=>t.replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");

async function run(){
const k=document.getElementById('apiKey').value.trim(),tp=document.getElementById('taskType').value,qc=document.getElementById('qCount').value,tx=document.getElementById('sTxt').value.trim(),out=document.getElementById('out');
if(!k){alert("أدخل مفتاح API!");return}
localStorage.setItem('msp_k',k);
if(!tx){alert("يرجى لصق نص المحاضرة هنا!");return}
out.style.display="block";out.innerHTML='<div class="ld">⏳ جاري توليد الأسئلة فوراً...</div>';

let ins="",js=false;
if(tp==="sum")ins="أنت أستاذ طب خبير. لخص النص المرفق بدقة لأسئلة الـ MCQ الطبية:";
else if(tp==="map"){js=true;ins='حول النص إلى خريطة ذهنية بصيغة JSON حصراً بهذا الهيكل بدون أي نصوص إضافية:{"title":"العنوان","branches":[{"branchTitle":"فرع","items":["نقطة 1"]}]}';}
else{js=true;ins=`أنشئ اختباراً طبياً من ${qc} أسئلة MCQ من النص المرفق بصيغة JSON حصراً بدون أي نصوص إضافية:[{"question":"السؤال؟","options":["خيار 1","خيار 2","خيار 3","خيار 4"],"correctIndex":0,"explanation":"الشرح العلمي."}]`;}

try{
let body={contents:[{parts:[{text:ins+"\n\n"+tx}]}]};
if(js)body.generationConfig={response_mime_type:"application/json"};

const u="https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key="+k;
const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const d=await r.json();
if(d.error){out.innerHTML=`<div class="res" style="color:red">❌ خطأ: ${d.error.message}</div>`;return}

const raw=d.candidates[0].content.parts[0].text;
if(tp==="sum")out.innerHTML=`<div class="res">${esc(raw)}</div>`;
else if(tp==="map"){
const cleanJson = raw.replace(/```json/g,'').replace(/```/g,'').trim();
const m=JSON.parse(cleanJson);
let h=`<div class="mm" style="background:#f8fafc;padding:18px;border-radius:12px"><div style="background:#0284c7;color:#fff;padding:12px;border-radius:10px;font-weight:700;text-align:center;margin-bottom:15px">🧠 ${esc(m.title)}</div>`;m.branches.forEach(b=>{h+=`<div style="background:#fff;padding:12px;margin-bottom:12px;border-radius:8px"><div style="font-weight:700;color:#0369a1;margin-bottom:8px">📌 ${esc(b.branchTitle)}</div><ul>`;b.items.forEach(it=>h+=`<li>${esc(it)}</li>`);h+=`</ul></div>`});out.innerHTML=h+`</div>`
}
else{
const cleanJson = raw.replace(/```json/g,'').replace(/```/g,'').trim();
qData=JSON.parse(cleanJson);
ansC=0;corC=0;let h="";
qData.forEach((q,qi)=>{
h+=`<div class="qc"><div class="qq">${qi+1}. ${esc(q.question)}</div>`;
q.options.forEach((o,oi)=>h+=`<button class="opt" id="b-${qi}-${oi}" onclick="chk(${qi},${oi})">${esc(o)}</button>`);
h+=`<div class="exp" id="e-${qi}"><strong>💡 التفسير:</strong><br>${esc(q.explanation)}</div></div>`
});
out.innerHTML=h+`<div class="sb" id="sb"></div>`;
}
}catch(e){out.innerHTML=`<div class="res" style="color:red">❌ خطأ: ${e.message}</div>`}
}

function chk(qi,si){
const q=qData[qi],ci=q.correctIndex;
for(let i=0;i<q.options.length;i++){const b=document.getElementById(`b-${qi}-${i}`);b.disabled=true;if(i===ci)b.classList.add('ok')}
if(si===ci)corC++;else document.getElementById(`b-${qi}-${si}`).classList.add('no');
document.getElementById(`e-${qi}`).style.display="block";
if(++ansC===qData.length){
const sb=document.getElementById('sb'),tot=qData.length,pct=Math.round((corC/tot)*100);
sb.innerHTML=`<h2>📊 التقييم</h2><p style="font-size:20px;font-weight:700">النتيجة: ${corC} من ${tot} (${pct}%)</p>`;
sb.style.display="block";sb.scrollIntoView({behavior:'smooth'});
}}
</script>
</body>
</html>
